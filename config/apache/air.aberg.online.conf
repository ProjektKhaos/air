<VirtualHost *:80>
 ServerName air.aberg.online
 DocumentRoot /var/www/abergonline/air
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
 RewriteRule ^ https://air.aberg.online%{REQUEST_URI} [R=301,L,NE]
 <Directory /var/www/abergonline/air>
  Options -Indexes -ExecCGI
  AllowOverride None
  Require all granted
 </Directory>
 ErrorLog ${APACHE_LOG_DIR}/air.aberg.online-error.log
 CustomLog ${APACHE_LOG_DIR}/air.aberg.online-access.log combined
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
 ServerName air.aberg.online
 DocumentRoot /var/www/abergonline/air
 DirectoryIndex index.php
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/air.aberg.online/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/air.aberg.online/privkey.pem
 Include /etc/letsencrypt/options-ssl-apache.conf
 <Directory /var/www/abergonline/air>
  Options -Indexes -ExecCGI
  AllowOverride None
  Require all granted
 </Directory>
 <LocationMatch "(?i)^/(app|cron|sql|storage|tests|test-results|playwright-report|vendor|docs|config|node_modules|scripts)(/|$)">
  Require all denied
 </LocationMatch>
 <LocationMatch "(?i)(^|/)\.(?!well-known(?:/|$))">
  Require all denied
 </LocationMatch>
 <FilesMatch "(?i)^(\.|composer\.(json|lock)|package(-lock)?\.json|phpunit(?:-live)?\.xml|playwright\.config\.js|.*\.(sql|md|env|ini|log|lock))$">
  Require all denied
 </FilesMatch>
 Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
 Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
 Header always set X-Content-Type-Options "nosniff"
 Header always set X-Frame-Options "DENY"
 Header always set Referrer-Policy "strict-origin-when-cross-origin"
 Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
 Header always set Cross-Origin-Opener-Policy "same-origin"
 Header always set Cross-Origin-Resource-Policy "same-origin"
 Header always unset X-Powered-By
 Header always unset Server
 <LocationMatch "^/api/">
  Header always set Cache-Control "no-store, max-age=0"
 </LocationMatch>
 <LocationMatch "^/(index\.php|stations\.php|station\.php|alerts\.php|offline\.php)?$">
  Header always set Cache-Control "no-store, max-age=0"
 </LocationMatch>
 <LocationMatch "^/assets/">
  Header set Cache-Control "public, max-age=31536000, immutable"
 </LocationMatch>
 ErrorLog ${APACHE_LOG_DIR}/air.aberg.online-error.log
 CustomLog ${APACHE_LOG_DIR}/air.aberg.online-access.log combined
</VirtualHost>
</IfModule>
