<VirtualHost *:80>
 ServerName air.aberg.online
 DocumentRoot /var/www/abergonline/air
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
 RewriteRule ^ https://air.aberg.online%{REQUEST_URI} [R=301,L,NE]
 <Directory /var/www/abergonline/air>
  Options -Indexes -ExecCGI
  AllowOverride None
  Require all granted
 </Directory>
 ErrorLog ${APACHE_LOG_DIR}/air.aberg.online-error.log
 CustomLog ${APACHE_LOG_DIR}/air.aberg.online-access.log combined
</VirtualHost>
